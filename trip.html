const ALL_TAGS = ["自然","历史","美食","亲子","免费","购物","宗教","演出","夜游","必去"];
const MEAL_PER_DAY = 120; // 餐饮估算（元/天）

function haversine(a,b){
  const R=6371,toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
function transitMin(a,b){ return Math.round(haversine(a,b)/4*60)+8; } // 步行+缓冲估算
function fmt(min){ const h=Math.floor(min/60),m=min%60; return (h<10?'0':'')+h+':'+(m<10?'0':'')+m; }

/* 地理最近邻串线：从最北的点出发，把景点串成一条尽量顺路的线。
   之后沿这条线均匀切段，就能得到“每天景点数均衡 + 地理相邻”的分天方案。 */
function nnPath(pts){
  if(!pts.length) return [];
  let pool=pts.slice();
  let cur=pool.reduce((a,b)=> a.lat>b.lat?a:b);   // 从最北的点开始
  pool.splice(pool.indexOf(cur),1);
  const out=[cur];
  while(pool.length){
    let ni=0,nd=1e9;
    pool.forEach((p,i)=>{const d=haversine(p,cur); if(d<nd){nd=d;ni=i;}});
    cur=pool.splice(ni,1)[0]; out.push(cur);
  }
  return out;
}

function buildDay(group, idx){
  if(!group.length) return {day:idx+1,items:[],cost:0};
  const cen={lat:group.reduce((s,p)=>s+p.lat,0)/group.length, lng:group.reduce((s,p)=>s+p.lng,0)/group.length};
  // nearest-neighbor order from centroid
  let pool=group.slice(), order=[];
  let cur=pool.reduce((a,b)=> haversine(a,cen)<haversine(b,cen)?a:b);
  pool.splice(pool.indexOf(cur),1); order.push(cur);
  while(pool.length){ let ni=0,nd=1e9; pool.forEach((p,i)=>{const d=haversine(p,cur); if(d<nd){nd=d;ni=i;}}); cur=pool.splice(ni,1)[0]; order.push(cur); }
  // meal spot in this group
  const meal=group.find(s=>s.tags&&s.tags.includes('美食'));
  let t=9*60, items=[], cost=0, prev=null;
  order.forEach((s,i)=>{
    if(i>0){ const m=transitMin(prev,s); items[items.length-1].transit=m; t+=m; }
    items.push({t, spot:s, dur:s.dur, transit:0});
    cost+= (s.ticket||0);
    t+=s.dur; prev=s;
  });
  // insert lunch around 12:00
  let li=items.findIndex(it=>it.t>=12*60);
  const lunchNote = meal? ('午餐可在「'+meal.n+'」附近解决') : '午餐自理';
  items.splice(li<0?items.length:li, 0, {meal:true, text:'🍜 '+lunchNote});
  return {day:idx+1, items, cost};
}

function plan(data, days, prefs){
  let spots=data.spots.map(s=>({...s}));
  spots.forEach(s=>{ const hit=(s.tags||[]).filter(t=>prefs.has(t)).length; s._score=1+hit*2+((s.tags||[]).includes('必去')?1:0); });
  spots.sort((a,b)=>b._score-a._score);
  const sel=spots.slice(0, Math.min(days*3, spots.length));
  const K=Math.min(days, sel.length);
  // 先按地理最近邻串成一条顺路的线，再均匀切成 K 段连续线路：
  // 每天景点数尽量均衡（±1），且同一天内景点地理相邻、不绕路。
  const order=nnPath(sel);
  const groups=[];
  for(let i=0;i<K;i++){
    const a=Math.floor(i*order.length/K), b=Math.floor((i+1)*order.length/K);
    groups.push(order.slice(a,b));
  }
  return groups.map((g,i)=>buildDay(g,i));
}

function render(data, days, dateStr){
  const prefs=new Set([...document.querySelectorAll('.tg.on')].map(e=>e.dataset.t));
  const planOut=plan(data, days, prefs);
  const hotelPy=data.py||'';
  const ci=dateStr||'';
  const co=ci? shiftDate(ci,days):'';
  const hotelUrl='https://hotel.qunar.com/city/'+hotelPy+'/'+(ci?('?fromDate='+ci+'&toDate='+co):'');
  let totalTicket=planOut.reduce((s,d)=>s+d.cost,0);
  let h='';
  // KPIs
  h+='<div class="kpis">'
    +'<div class="kpi"><b>'+planOut.length+'</b><span>规划天数</span></div>'
    +'<div class="kpi"><b>'+planOut.reduce((s,d)=>s+d.items.filter(i=>!i.meal).length,0)+'</b><span>安排景点</span></div>'
    +'<div class="kpi"><b>¥'+(totalTicket)+'</b><span>门票合计</span></div>'
    +'<div class="kpi"><b>¥'+(MEAL_PER_DAY*days)+'</b><span>餐饮估算</span></div>'
    +'</div>';
  // tabs
  h+='<div class="tabs" id="tabs">';
  planOut.forEach((d,i)=> h+='<div class="tab'+(i===0?' act':'')+'" data-d="'+i+'">第'+(i+1)+'天</div>');
  h+='</div>';
  // day panel
  h+='<div class="panel" id="daypanel"></div>';
  // hotel
  h+='<div class="panel"><div class="hotel"><b>🏨 住宿</b>'
    +'<a href="'+hotelUrl+'" target="_blank">在去哪儿查看 '+data.city+' 酒店 →</a>'
    +'<span class="meta" style="color:var(--mut);font-size:12px">入住 '+ci+' / 退房 '+co+'</span></div></div>';
  document.getElementById('out').innerHTML=h;
  const draw=d=>{
    let p='<div class="tl">';
    d.items.forEach(it=>{
      if(it.meal){ p+='<div class="meal">'+it.text+'</div>'; return; }
      const s=it.spot;
      const tags=(s.tags||[]).map(t=>'<span class="badge b-t">'+t+'</span>').join('');
      const tr=it.transit? '<span class="badge b-tr">↔ '+it.transit+'min</span>':'';
      p+='<div class="ti"><div class="dot"></div><div class="time">'+fmt(it.t)+'</div>'
        +'<div class="body"><div class="nm">'+s.n+'</div>'
        +'<div class="meta">'+tags+tr+'⏱ '+Math.round(s.dur/60*10)/10+'h · 🎫 '+(s.ticket?('¥'+s.ticket):'免费')+' · 🕒 '+(s.open||'')+'</div>'
        +(s.note?'<div class="note">'+s.note+'</div>':'')+'</div></div>';
    });
    p+='</div>';
    p+='<div class="meta" style="margin-top:8px">当日门票合计 ¥'+d.cost+'</div>';
    document.getElementById('daypanel').innerHTML=p;
  };
  draw(planOut[0]);
  document.querySelectorAll('#tabs .tab').forEach(t=> t.onclick=()=>{
    document.querySelectorAll('#tabs .tab').forEach(x=>x.classList.remove('act'));
    t.classList.add('act'); draw(planOut[+t.dataset.d]);
  });
}
function shiftDate(s,n){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

// init
const citySel=document.getElementById('city');
Object.keys(CITIES).forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=CITIES[c].city; citySel.appendChild(o); });
citySel.value=Object.keys(CITIES)[0];
const prefsBox=document.getElementById('prefs');
ALL_TAGS.forEach(t=>{ const e=document.createElement('span'); e.className='tg'; e.dataset.t=t; e.textContent=t;
  e.onclick=()=>e.classList.toggle('on'); prefsBox.appendChild(e); });
// default date = today+14
const def=new Date(); def.setDate(def.getDate()+14);
document.getElementById('date').value=def.toISOString().slice(0,10);
document.getElementById('go').onclick=()=>{
  const c=CITIES[citySel.value]; const days=Math.max(1,Math.min(7,+document.getElementById('days').value||3));
  document.getElementById('days').value=days;
  render(c, days, document.getElementById('date').value);
};
// first render
render(CITIES[citySel.value], 3, document.getElementById('date').value);
</script>
