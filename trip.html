<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行程攻略 · 12306 最便宜路线</title>
<style>
:root{--blue:#2563eb;--ind:#4f46e5;--bg:#f5f7fb;--card:#fff;--line:#e6e9f0;--mut:#6b7280;--ok:#16a34a;--warn:#b45309}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:#1f2937;line-height:1.5}
.hd{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#0f172a;color:#fff}
.logo{font-weight:800;font-size:16px}
.hd a{color:#cbd5e1;text-decoration:none;font-size:13px;padding:5px 10px;border-radius:8px}
.hd a.act{background:#1e293b;color:#fff}
.hd a:hover{color:#fff}
.wrap{max-width:920px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:22px;margin:6px 0 2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;
  box-shadow:0 1px 3px rgba(15,23,42,.04)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut)}
.fld select,.fld input{padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px;color:#111;background:#fff}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.tg{font-size:12.5px;padding:5px 11px;border:1px solid var(--line);border-radius:20px;cursor:pointer;user-select:none;background:#fff;color:#374151}
.tg.on{background:var(--ind);border-color:var(--ind);color:#fff}
.btn{margin-top:14px;display:inline-block;background:linear-gradient(135deg,var(--blue),var(--ind));color:#fff;border:0;
  padding:11px 22px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.06)}

/* ---- 城市封面 ---- */
.hero{position:relative;border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 4px 16px rgba(15,23,42,.12)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .hbg{position:absolute;inset:0;background:linear-gradient(105deg,rgba(15,23,42,.82) 8%,rgba(15,23,42,.55) 55%,rgba(15,23,42,.2) 100%)}
.hero .hin{position:relative;padding:22px 20px;color:#fff}
.hero h2{margin:0 0 4px;font-size:24px;font-weight:800;letter-spacing:.5px}
.hero .hmeta{font-size:12.5px;opacity:.92;margin-bottom:8px}
.hero .hintro{font-size:13px;opacity:.95;line-height:1.75;max-width:640px}
.hero .hchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hero .hchip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);
  border-radius:20px;padding:4px 12px;font-size:12px;backdrop-filter:blur(4px)}

/* ---- KPI ---- */
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.kpi{flex:1;min-width:112px;background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.kpi b{display:block;font-size:18px;color:var(--ind)}
.kpi span{font-size:12px;color:var(--mut)}

/* ---- 天数 tab ---- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.tab{padding:7px 15px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px}
.tab.act{background:var(--blue);color:#fff;border-color:var(--blue)}

/* ---- 每日时间轴 ---- */
.tl{position:relative;margin-left:8px}
.ti{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.ti:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--blue);margin-top:5px;flex:none;box-shadow:0 0 0 4px #dbeafe}
.time{font-weight:700;font-size:13px;color:#111;width:48px;flex:none;padding-top:1px}
.body{flex:1;min-width:0}
.nm{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sph{width:60px;height:44px;border-radius:8px;object-fit:cover;flex:none;border:1px solid var(--line)}
.meta{font-size:12px;color:var(--mut);margin-top:3px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;margin-right:5px}
.b-t{background:#ecfdf5;color:var(--ok)} .b-tr{background:#fef3c7;color:var(--warn)}
.meal{background:#fff7ed;border:1px dashed #fdba74;border-radius:10px;padding:9px 13px;margin:8px 0;font-size:13px;color:#9a3412}
.transit{font-size:12px;color:#64748b;margin:2px 0 0;padding-left:2px;display:flex;align-items:center;gap:5px}
.note{font-size:12px;color:#475569;margin-top:5px;background:#f8fafc;border-left:3px solid #cbd5e1;
  padding:6px 10px;border-radius:0 8px 8px 0;line-height:1.65}
.dayend{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--mut)}

/* ---- 预算 / 清单 / 住宿 ---- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
.blk{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.blk h4{margin:0 0 8px;font-size:13.5px;color:#0f172a;display:flex;align-items:center;gap:6px}
.blk ul{margin:0;padding-left:18px;font-size:12.5px;color:#475569;line-height:1.85}
.blk .price{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:#475569}
.blk .price b{color:#0f172a}
.blk .price.total{border-top:1px dashed #cbd5e1;margin-top:6px;padding-top:7px;font-weight:700}
.hotel{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hotel a{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;text-decoration:none;color:var(--blue);font-weight:600}
.hotel a:hover{border-color:var(--blue)}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:24px;line-height:1.7}
.foot a{color:var(--blue);text-decoration:none}
.warn{font-size:12px;color:var(--warn);background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:8px 11px;margin-top:10px}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:26px 0}

/* ---- 每日小地图 ---- */
.daysmall{height:208px;border-radius:12px;overflow:hidden;border:1px solid var(--line);
  margin:0 0 14px;background:#eef2f7;position:relative}
.daysmall .mlabel{position:absolute;top:8px;left:10px;z-index:500;background:rgba(15,23,42,.72);
  color:#fff;font-size:12px;padding:3px 10px;border-radius:8px;backdrop-filter:blur(3px)}
.daysmall .merr{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  color:var(--mut);font-size:12px}
.daysmall .leaflet-tooltip{font-size:12px;font-weight:700}
.daysmall .leaflet-container{font-family:inherit}

/* ---- 去程卡片（P3） ---- */
.tcard{background:linear-gradient(135deg,#eef5ff,#f6fbff);border-color:#cfe2ff}
.tcard-h{font-weight:700;font-size:14px;margin-bottom:4px}
.tcard-r{font-size:13px;color:var(--ink);margin-bottom:7px}
.tcard-s{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tcard-link{color:var(--blue);text-decoration:none;font-weight:600}
.btn.sm{display:inline-block;padding:5px 12px;font-size:13px;margin:0}

/* ---- 偏好命中条 ---- */
.prefbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:12px 0 2px;padding:10px 12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;font-size:12.5px;color:#334155}
.prefbar b{font-size:13px}
.ptag{display:inline-block;padding:2px 9px;border-radius:20px;background:#e0edff;color:#1d4ed8;border:1px solid #bfdbfe;font-size:12px;line-height:1.5}
.ptag.pt-mut{background:#f1f5f9;color:#94a3b8;border-color:#e2e8f0}
.pmeta{margin-left:auto;color:#64748b}
.pmeta b{color:#1d4ed8}
.badge.b-hit{background:#fff7ed;color:#c2410c;border-color:#fed7aa}

/* ---- 行程分享 / 导出（P4） ---- */
.tb{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
.tb .btn{margin-top:0}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#0f172a;color:#fff;
  padding:10px 18px;border-radius:10px;font-size:13px;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
</style>

function haversine(a,b){
  const R=6371,toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
function transitMin(a,b){ return Math.round(haversine(a,b)/4*60)+8; } // 步行+缓冲估算
function fmt(min){ const h=Math.floor(min/60),m=min%60; return (h<10?'0':'')+h+':'+(m<10?'0':'')+m; }
function dur(min){ const n=Math.round(min||0); const h=Math.floor(n/60),m=n%60;
  return h>0? (h+'小时'+(m?m+'分':'')) : (m+'分钟'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function normCity(s){ return String(s||'').replace(/[\s|/、]/g,''); }
function matchStoredRoute(fromCity, destCity, date){
  try{
    const raw=localStorage.getItem('irt_last_route');
    if(!raw) return null;
    const o=JSON.parse(raw);
    if(!o || !o.fromLabel || !o.toLabel) return null;
    const f=normCity(fromCity), t=normCity(destCity);
    const sf=normCity(o.fromLabel), st=normCity(o.toLabel);
    const fm=(sf.indexOf(f)>=0||f.indexOf(sf)>=0);
    const tm=(st.indexOf(t)>=0||t.indexOf(st)>=0);
    const dm=(!o.date || !date || o.date===date);
    return (fm&&tm&&dm)? o : null;
  }catch(e){ return null; }
}

/* WGS-84 -> GCJ-02（火星坐标系），用于在高德底图上精确对齐。
   景点坐标是真实经纬度(WGS84)，高德瓦片是 GCJ02，必须转换，否则偏几百米。 */
function wgs84ToGcj02(lng,lat){
  if(!(lng>73.66&&lng<135.05&&lat>3.86&&lat<53.55)) return [lng,lat];
  const a=6378245.0, ee=0.00669342162296594323;
  let dLat=-100+2*lng+3*lat+0.2*lat*lat+0.1*lng*lat+0.2*Math.sqrt(Math.abs(lng));
  dLat+=(20*Math.sin(6*lng*Math.PI)+20*Math.sin(2*lng*Math.PI))*2/3;
  dLat+=(20*Math.sin(lat*Math.PI)+40*Math.sin(lat/3*Math.PI))*2/3;
  dLat+=(160*Math.sin(lat/12*Math.PI)+320*Math.sin(lat*Math.PI/30))*2/3;
  let dLng=300+lng+2*lat+0.1*lng*lng+0.1*lng*lat+0.1*Math.sqrt(Math.abs(lng));
  dLng+=(20*Math.sin(6*lng*Math.PI)+20*Math.sin(2*lng*Math.PI))*2/3;
  dLng+=(20*Math.sin(lng*Math.PI)+40*Math.sin(lng/3*Math.PI))*2/3;
  dLng+=(150*Math.sin(lng/12*Math.PI)+300*Math.sin(lng/30*Math.PI))*2/3;
  const radLat=lat/180*Math.PI;
  let magic=Math.sin(radLat); magic=1-ee*magic*magic;
  const sqrtMagic=Math.sqrt(magic);
  dLat=(dLat*180.0)/((a*(1-ee))/(magic*sqrtMagic)*Math.PI);
  dLng=(dLng*180.0)/(a/sqrtMagic*Math.cos(radLat)*Math.PI);
  return [lng+dLng, lat+dLat];
}

/* 地理最近邻串线：从最北的点出发，把景点串成一条尽量顺路的线。
   之后沿这条线均匀切段，就能得到"每天景点数均衡 + 地理相邻"的分天方案。 */
function nnPath(pts){
  if(!pts.length) return [];
  let pool=pts.slice();
  let cur=pool.reduce((a,b)=> a.lat>b.lat?a:b);
  pool.splice(pool.indexOf(cur),1);
  const out=[cur];
  while(pool.length){
    let ni=0,nd=1e9;
    pool.forEach((p,i)=>{const d=haversine(p,cur); if(d<nd){nd=d;ni=i;}});
    cur=pool.splice(ni,1)[0]; out.push(cur);
  }
  return out;
}

function buildDay(group, idx, ctx){
  if(!group.length) return {day:idx+1,items:[],cost:0,walk:0,theme:''};
  // 1) 组内动线：从最靠近本组重心的点出发，最近邻串线
  const cen={lat:group.reduce((s,p)=>s+p.lat,0)/group.length, lng:group.reduce((s,p)=>s+p.lng,0)/group.length};
  const order=nnPath(group);
  // 2) 时间轴：09:00 出发，按停留时长累加，路上时间按地理距离估算
  let t=9*60, items=[], cost=0, walk=0, prev=null;
  order.forEach((s,i)=>{
    if(i>0){
      const km=haversine(prev,s);
      const m=transitMin(prev,s);
      walk+=km;
      items.push({transit:m, km:km, from:prev.n, to:s.n});
      t+=m;
    }
    items.push({t, spot:s});
    cost+=(s.ticket||0);
    t+=s.dur; prev=s;
  });
  // 3) 插入用餐：找第一个 12:00 之后的节点
  const li=items.findIndex(it=>it.t!==undefined && it.t>=12*60);
  const mealSpot=group.find(s=>(s.tags||[]).includes('美食')) || order[Math.floor(order.length/2)];
  const lunchNote='午餐：'+(mealSpot?('在「'+mealSpot.n+'」附近解决'):'午餐自理');
  const dinnerNote='晚餐：'+((order[order.length-1].tags||[]).includes('美食')
      ? ('推荐「'+order[order.length-1].n+'」一带'):'建议在酒店附近解决');
  items.splice(li<0?items.length:li, 0, {meal:true, text:'🍜 '+lunchNote});
  // 4) 当日主题：取评分最高的必去/自然/历史标签
  let theme='城市漫游';
  const best=order.slice().sort((a,b)=>(b.dur||0)-(a.dur||0))[0];
  const tg=(best.tags||[])[0];
  if(tg) theme=tg+' · '+best.n;
  return {day:idx+1, items, cost, walk, theme, dinnerNote};
}

function plan(data, days, prefs){
  const all=data.spots.map(s=>({...s}));
  all.forEach(s=>{
    const tags=s.tags||[];
    s._hit=tags.filter(t=>prefs.has(t)).length;      // 命中几个偏好
    s._star=s._hit>0;
    s._score=s._hit*3+((tags.includes('必去'))?2:0)+1;
  });
  all.sort((a,b)=>b._score-a._score);
  const cap=Math.min(days*3, all.length);                 // 上限：每天最多 3 个
  const floor=Math.min(all.length, Math.max(days, 3));    // 下限：每天至少 1 个，别把行程抽空
  // 偏好真正参与筛选：选了偏好就只看命中项，不够再用高分项补齐
  let sel = prefs.size ? all.filter(s=>s._hit>0) : all.slice();
  if(sel.length<floor){
    sel=sel.concat(all.filter(s=>s._hit===0).slice(0, floor-sel.length));
  }
  sel=sel.slice(0, Math.max(floor, Math.min(cap, sel.length)));
  const K=Math.min(days, sel.length);
  // 先按地理最近邻串成一条顺路的线，再均匀切成 K 段连续线路：
  // 每天景点数尽量均衡（±1），且同一天内景点地理相邻、不绕路。
  const order=nnPath(sel);
  const groups=[];
  for(let i=0;i<K;i++){
    const a=Math.floor(i*order.length/K), b=Math.floor((i+1)*order.length/K);
    groups.push(order.slice(a,b));
  }
  return groups.map((g,i)=>buildDay(g,i,data));
}

  li.push('车票：本机查好去程 / 返程的最便宜组合，<b>提前 15 天</b>放票即抢');
  li.push('身份证：预约类景点（故宫、布达拉宫、鼓浪屿等）需实名预约');
  li.push('天气：出发前 3 天再确认<b>降水与气温</b>，' + city + (dateStr?('（'+dateStr+' 出发）'):'') + '山区与高原温差大，带一件薄外套');
  if(prefs.has('自然')) li.push('自然景点多：防晒霜、驱蚊液、登山鞋');
  if(prefs.has('历史')) li.push('历史人文为主：博物馆多<b>周一闭馆</b>，提前调开顺序');
  if(prefs.has('美食')) li.push('美食偏好：夜市与小吃街集中在 18:00 后，留出晚餐时段');
  if(prefs.has('亲子')) li.push('亲子出行：儿童票按身高/年龄核，带常用药与推车');
  if(prefs.has('宗教')) li.push('寺庙 / 清真寺：注意着装（勿短裤露肩），部分需脱鞋');
  if(city==='拉萨'||city==='西宁'||city==='昆明'||city==='丽江'||city==='大理') li.push('高原地区：<b>布达拉宫需提前预约</b>，首日不安排剧烈活动');
  if(city==='三亚'||city==='海口'||city==='厦门'||city==='青岛'||city==='威海') li.push('海滨城市：泳衣、防晒、拖鞋，旺季住宿需提前订');

  return li;
}

    p+='<div class="dayend">🎫 当日门票 <b>¥'+d.cost+'</b> · 市内步行约 <b>'+d.walk.toFixed(1)+'km</b>'

    p+='<div class="transit" style="margin-top:6px">🍽 '+esc(d.dinnerNote||'晚餐自理')+'</div>';
    document.getElementById('daypanel').innerHTML=p;
    // 每天的小地图：只给有坐标的景点画
    const seq = ++dayMapSeq;
    setTimeout(()=> initDayMap(seq, d), 0);
  };

/* 在 #daysmall 内渲染当日景点序号 Markers + 游览顺序连线 */
function initDayMap(seq, d){
  const el=document.getElementById('daysmall');
  if(!el) return;
  // 切换天数时先销毁上一天的地图实例，避免反复切换累积多个 Leaflet 地图（泄漏 / 多余瓦片请求）
  if(dayMap){ try{ dayMap.remove(); }catch(e){} dayMap=null; }
  if(!window.L){ const e2=el.querySelector('.merr'); if(e2) e2.style.display='flex'; return; }
  const pts=d.items.filter(it=>it.spot && it.spot.lat!=null && it.spot.lng!=null).map(it=>it.spot);
  if(pts.length===0){ el.querySelector('.merr').style.display='flex'; return; }
  const ll=pts.map((s,i)=>{ const g=wgs84ToGcj02(s.lng,s.lat); return {ll:[g[1],g[0]], n:s.n, i}; });
  const map=L.map(el,{zoomControl:true,scrollWheelZoom:false,attributionControl:false})
    .setView(ll[0].ll, 12);
  dayMap=map;
  const amap=L.tileLayer(
    'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
    {maxZoom:18, subdomains:'1234', attribution:'© 高德地图'});
  amap.addTo(map);
  let amapErr=0;
  amap.on('tileerror', ()=>{ if(++amapErr>=3) el.querySelector('.merr').style.display='flex'; });
  const latlngs=ll.map(o=>o.ll);
  if(latlngs.length>1){
    L.polyline(latlngs,{color:'#2563eb',weight:3,opacity:.85,dashArray:'5 6'}).addTo(map);
  }
  ll.forEach(o=>{
    L.marker(o.ll,{title:o.n}).addTo(map)
      .bindTooltip((o.i+1)+'. '+o.n,{permanent:false,direction:'top'});
  });
  if(latlngs.length>1) map.fitBounds(latlngs,{padding:[26,26]});
  setTimeout(()=> map.invalidateSize(), 40);
}
  draw(planOut[0]);
  document.querySelectorAll('#tabs .tab').forEach(t=> t.onclick=()=>{
    document.querySelectorAll('#tabs .tab').forEach(x=>x.classList.remove('act'));
    t.classList.add('act'); draw(planOut[+t.dataset.d]);
  });
}
function shiftDate(s,n){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

/* =================== P4：分享链接 + 导出图片 =================== */
function readForm(){
  const prefs=[...document.querySelectorAll('.tg.on')].map(e=>e.dataset.t).join(',');
  return {
    from:(document.getElementById('from').value||'').trim(),
    city:document.getElementById('city').value,
    days:document.getElementById('days').value,
    date:document.getElementById('date').value,
    budget:document.getElementById('budget').value,
    prefs:prefs
  };
}
function syncUrl(){
  try{
    const f=readForm();
    const p=new URLSearchParams();
    if(f.from && f.from!=='济南') p.set('from',f.from);
    if(f.city) p.set('city',f.city);
    if(f.days && +f.days!==3) p.set('days',f.days);
    if(f.date) p.set('date',f.date);
    if(f.budget && +f.budget!==300) p.set('budget',f.budget);
    if(f.prefs) p.set('prefs',f.prefs);
    const qs=p.toString();
    history.replaceState(null,'', location.pathname+(qs?('?'+qs):''));
  }catch(e){ /* file:// 等环境忽略 */ }
}
function copyLink(){
  syncUrl();
  const url=location.href;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>toast('链接已复制 ✓'), ()=>fallbackCopy(url));
  } else fallbackCopy(url);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('链接已复制 ✓'); }
  catch(e){ toast('复制失败，请手动复制地址栏链接'); }
  document.body.removeChild(ta);
}
function applyParams(){
  const p=new URLSearchParams(location.search);
  if(p.has('from')) document.getElementById('from').value=p.get('from');
  if(p.has('city') && CITIES[p.get('city')]) document.getElementById('city').value=p.get('city');
  if(p.has('days')) document.getElementById('days').value=p.get('days');
  if(p.has('date')) document.getElementById('date').value=p.get('date');
  if(p.has('budget')) document.getElementById('budget').value=p.get('budget');
  if(p.has('prefs')){
    document.querySelectorAll('.tg.on').forEach(e=>e.classList.remove('on'));
    p.get('prefs').split(',').filter(Boolean).forEach(t=>{
      const e=prefsBox.querySelector('[data-t="'+t+'"]'); if(e) e.classList.add('on');
    });
  }
}
function roundRect(ctx,x,y,w,h,r){
  if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); return; }
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function exportImage(){
  if(!LAST){ toast('请先生成行程'); return; }
  const S=2, W=720, PAD=26, inner=W-PAD*2;
  const items=[];
  const add=(h,draw)=>items.push({h,draw});
  const c=LAST;
  // 头部
  add(128,(ctx,y)=>{
    const g=ctx.createLinearGradient(0,y,W,y+128);
    g.addColorStop(0,'#0f172a'); g.addColorStop(1,'#2563eb');
    ctx.fillStyle=g; ctx.fillRect(0,y,W,128);
    ctx.fillStyle='#fff'; ctx.textBaseline='top';
    ctx.font='800 30px sans-serif'; ctx.fillText(c.data.city, PAD, y+26);
    ctx.font='14px sans-serif'; ctx.fillStyle='rgba(255,255,255,.9)';
    ctx.fillText(c.days+' 天 · '+c.spotCount+' 个景点 · '+(c.dateStr?c.dateStr+' 出发':''), PAD, y+66);
    ctx.fillStyle='rgba(255,255,255,.7)'; ctx.font='12px sans-serif';
    ctx.fillText('自动行程攻略 · 由 12306 最便宜路线生成', PAD, y+92);
  });
  // KPI
  const kpis=[['规划天数',c.days+' 天'],['景点',c.spotCount+' 个'],['门票','¥'+c.totalTicket],
              ['餐饮','¥'+(MEAL_PER_DAY*c.days)],['步行',c.totalWalk.toFixed(1)+'km']];
  add(66,(ctx,y)=>{
    const n=kpis.length, gap=8, bw=(inner-gap*(n-1))/n;
    kpis.forEach((k,i)=>{
      const x=PAD+i*(bw+gap);
      ctx.fillStyle='#f1f5f9'; roundRect(ctx,x,y,bw,52,8); ctx.fill();
      ctx.fillStyle='#0f172a'; ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.font='700 17px sans-serif'; ctx.fillText(k[1], x+bw/2, y+9);
      ctx.fillStyle='#64748b'; ctx.font='11px sans-serif'; ctx.fillText(k[0], x+bw/2, y+34);
      ctx.textAlign='left';
    });
  });
  // 每天
  c.planOut.forEach(d=>{
    add(40,(ctx,y)=>{
      ctx.fillStyle='#2563eb'; roundRect(ctx,PAD,y,4,22,2); ctx.fill();
      ctx.fillStyle='#0f172a'; ctx.textBaseline='top'; ctx.font='700 17px sans-serif';
      ctx.fillText('第'+d.day+'天'+(d.theme?(' · '+d.theme):''), PAD+12, y+2);
    });
    let lastTransit=null;
    d.items.forEach(it=>{
      if(it.transit!==undefined){ lastTransit=it; return; }
      if(it.meal){
        add(30,(ctx,y)=>{
          ctx.fillStyle='#fff7ed'; roundRect(ctx,PAD,y,inner,26,8); ctx.fill();
          ctx.fillStyle='#9a3412'; ctx.font='12px sans-serif'; ctx.textBaseline='top';
          ctx.fillText(it.text.replace(/^🍜\s*/,''), PAD+10, y+6);
        });
        return;
      }
      const s=it.spot;
      const durTxt=Math.round(s.dur/60*10)/10;
      const meta=(durTxt>0?(durTxt+' 小时 '):'')+'· '+(s.ticket?('¥'+s.ticket):'免费')+(s.open?(' · '+s.open):'');
      if(lastTransit){
        add(22,(ctx,y)=>{
          ctx.fillStyle='#64748b'; ctx.font='11px sans-serif'; ctx.textBaseline='top';
          ctx.fillText('→ 从「'+lastTransit.from+'」到「'+lastTransit.to+'」约 '+lastTransit.transit+' 分钟（'+(lastTransit.km).toFixed(1)+'km）', PAD+12, y+4);
        });
        lastTransit=null;
      }
      add(46,(ctx,y)=>{
        ctx.fillStyle='#2563eb'; ctx.beginPath(); ctx.arc(PAD+5,y+15,5,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#0f172a'; ctx.font='700 14px sans-serif'; ctx.textBaseline='top';
        ctx.fillText(fmt(it.t), PAD+18, y+1);
        ctx.fillStyle='#111'; ctx.font='700 15px sans-serif';
        ctx.fillText(s.n, PAD+70, y+1);
        ctx.fillStyle='#64748b'; ctx.font='11.5px sans-serif';
        ctx.fillText(meta, PAD+70, y+23);
      });
    });
    add(30,(ctx,y)=>{
      ctx.fillStyle='#64748b'; ctx.font='12px sans-serif'; ctx.textBaseline='top';
      ctx.fillText('当日门票 ¥'+d.cost+' · 步行 '+d.walk.toFixed(1)+'km'+(d.dinnerNote?(' · '+d.dinnerNote):''), PAD+12, y+6);
    });
  });
  // 预算 + 住宿
  add(98,(ctx,y)=>{
    ctx.fillStyle='#f8fafc'; roundRect(ctx,PAD,y,inner,86,12); ctx.fill();
    ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1; roundRect(ctx,PAD,y,inner,86,12); ctx.stroke();
    ctx.fillStyle='#0f172a'; ctx.font='700 14px sans-serif'; ctx.textBaseline='top';
    ctx.fillText('预算参考（'+c.days+' 天，不含往返大交通与住宿）', PAD+14, y+13);
    ctx.font='12.5px sans-serif'; ctx.fillStyle='#475569';
    const lines=[
      '门票 ¥'+c.totalTicket+' · 餐饮 ¥'+(MEAL_PER_DAY*c.days)+' · 市内交通 ¥'+(30*c.days),
      '合计约 ¥'+(c.totalTicket+MEAL_PER_DAY*c.days+30*c.days),
      '住宿：在去哪儿查看 '+c.data.city+' 酒店（入住 '+c.ci+' / 退房 '+c.co+'）'
    ];
    lines.forEach((t,i)=> ctx.fillText(t, PAD+14, y+40+i*16));
  });
  // 计算总高度并绘制
  let totalH=PAD; items.forEach(it=> totalH+=it.h+10); totalH+=PAD;
  const cv=document.createElement('canvas');
  cv.width=W*S; cv.height=Math.round(totalH*S);
  const ctx=cv.getContext('2d'); ctx.scale(S,S);
  ctx.fillStyle='#eef2f7'; ctx.fillRect(0,0,W,totalH);
  let y=PAD; items.forEach(it=>{ it.draw(ctx,y); y+=it.h+10; });
  cv.toBlob(b=>{
    if(!b){ toast('导出失败，请重试'); return; }
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download=c.data.city+'_'+c.days+'天行程.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast('行程图已导出 ✓');
  },'image/png');
}
function toast(msg){
  let t=document.getElementById('__toast');
  if(!t){ t=document.createElement('div'); t.id='__toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),1800);
}

// init
const citySel=document.getElementById('city');
Object.keys(CITIES).forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=CITIES[c].city; citySel.appendChild(o); });
citySel.value=Object.keys(CITIES)[0];
const prefsBox=document.getElementById('prefs');
// 立即按当前表单重新规划（偏好标签一点即生效，不用再点「生成行程」）
function refresh(){
  const c=CITIES[citySel.value];
  let days=Math.max(1,Math.min(7,+document.getElementById('days').value||3));
  document.getElementById('days').value=days;
  render(c, days, document.getElementById('date').value, +document.getElementById('budget').value);
  syncUrl();
}
ALL_TAGS.forEach(t=>{ const e=document.createElement('span'); e.className='tg'; e.dataset.t=t; e.textContent=t;
  e.onclick=()=>{ e.classList.toggle('on'); refresh(); }; prefsBox.appendChild(e); });
// 默认勾选几个常见偏好
['必去','美食','自然'].forEach(t=>{ const e=prefsBox.querySelector('[data-t="'+t+'"]'); if(e) e.classList.add('on'); });
// default date = today+14
const def=new Date(); def.setDate(def.getDate()+14);
document.getElementById('date').value=def.toISOString().slice(0,10);
applyParams();   // P4：若带 ?city=&days=&prefs= 等参数，按链接预填
// 城市 / 天数 / 日期 / 预算 / 出发地 变化即重算
['city','days','date','budget','from'].forEach(id=>{
  const el=document.getElementById(id);
  if(el) el.addEventListener('change', refresh);
});
document.getElementById('go').onclick=refresh;
// first render
refresh();   // P4：首屏渲染并同步 URL（applyParams 已在上方预填链接参数）
</script>
