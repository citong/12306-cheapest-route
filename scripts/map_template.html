<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>车站地图 · 12306 最便宜路线</title>
<style>
:root{
  --bg:#eef1f6; --card:#fff; --ink:#0f172a; --sub:#64748b; --line:#e7ebf1;
  --green:#10b981; --green-2:#059669; --green-soft:#d1fae5; --blue:#3b82f6;
  --amber:#f59e0b; --red:#ef4444;
  --radius:14px; --shadow-sm:0 1px 3px rgba(15,23,42,.06); --shadow:0 6px 22px rgba(15,23,42,.08);
  --grad:linear-gradient(135deg,#34d399,#10b981 50%,#059669);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
header{background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);min-height:56px;
  display:flex;align-items:center;gap:10px;padding:9px 16px;position:sticky;top:0;z-index:1060;
  flex-wrap:wrap;box-shadow:0 6px 20px rgba(15,23,42,.05)}
.logo{font-size:16.5px;font-weight:800;white-space:nowrap;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.q{display:flex;gap:8px;align-items:center;position:relative}
.q input{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;
  font-family:inherit;width:200px;color:var(--ink);background:#fbfcfe;transition:.15s}
.q input:hover{border-color:#cbd5e1}
.q input:focus{outline:none;border-color:var(--green);background:#fff;box-shadow:0 0 0 4px var(--green-soft)}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;
  padding:8px 15px;font-size:13.5px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--green);color:var(--green-2)}
.btn.main{background:var(--grad);border-color:transparent;color:#fff;font-weight:700;
  box-shadow:0 4px 12px rgba(16,185,129,.32)}
.btn.main:hover{filter:brightness(1.05);color:#fff}
.hint{font-size:12.5px;color:var(--sub);margin-left:auto}

.sug{position:absolute;top:100%;left:0;width:290px;background:#fff;border:1px solid var(--line);
  border-radius:12px;margin-top:6px;max-height:250px;overflow:auto;z-index:1070;
  box-shadow:0 10px 30px rgba(15,23,42,.14);display:none}
.sug.on{display:block}
.sug .g{font-size:11.5px;color:#9ca3af;padding:6px 12px 3px;font-weight:600}
.sug div.i{padding:7px 12px;cursor:pointer;font-size:13.5px;display:flex;gap:8px}
.sug div.i:hover{background:#f6f8fb}
.sug div.i span{margin-left:auto;color:#9ca3af;font-size:11.5px}

#wrap{display:flex;height:calc(100vh - 57px)}
#side{width:240px;flex:none;background:#fff;border-right:1px solid var(--line);
  overflow:auto;padding:14px;box-shadow:2px 0 14px rgba(15,23,42,.04)}
#side h3{margin:2px 0 9px;font-size:13px;color:var(--sub);font-weight:700;letter-spacing:.2px}
.st{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;
  cursor:pointer;font-size:13.5px;transition:background .12s}
.st:hover{background:#f1f5f9}
.st b{width:9px;height:9px;border-radius:50%;flex:none}
.st.g b{background:var(--green)} .st.r b{background:var(--red)}
.st.b b{background:var(--blue)} .st.o b{background:var(--amber)}
.st.g2 b{background:#d1d5db}
.st.fail{opacity:.5}
.st span{margin-left:auto;font-size:11.5px;color:#9ca3af;font-variant-numeric:tabular-nums}
.st .rt{margin-left:6px;font-size:11px;color:var(--blue)}
#map{flex:1;height:100%;min-width:0;background:#dfe7ee}
.note{padding:9px 11px;background:#f6f8fb;border:1px solid var(--line);
  border-radius:11px;font-size:12.5px;color:var(--sub);margin-bottom:11px;line-height:1.55}
.note.err{background:#fee2e2;border-color:#fecaca;color:#b91c1c}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);
  margin:0 0 11px;padding-bottom:9px;border-bottom:1px dashed var(--line)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
@media(max-width:720px){
  #wrap{flex-direction:column;height:auto}
  #side{width:auto;border-right:none;border-bottom:1px solid var(--line);max-height:36vh}
  #map{height:64vh}
  .hint{display:none}
  .q input{width:150px}
}
</style>
</head>
<body>
<header>
  <div class="logo">🗺 车站地图</div>
  <div class="q">
    <input id="q" autocomplete="off" placeholder="搜车站 / 城市，如 郑州">
    <div class="sug" id="sug"></div>
    <button class="btn main" id="go">定位</button>
    <button class="btn" id="fit">回到全部</button>
    <button class="btn" id="base">切换底图</button>
  </div>
  <div class="hint" id="hint">正在加载地图…</div>
  <a class="btn" href="index.html">← 路线查询</a>
  <a class="btn" href="trip.html">✈️ 行程攻略</a>
</header>

<div id="wrap">
  <div id="side">
    <div class="note" id="note">正在加载地图组件…</div>
    <div class="legend">
      <span><i style="background:#16a34a"></i>起点</span>
      <span><i style="background:#dc2626"></i>终点</span>
      <span><i style="background:#2563eb"></i>中转</span>
      <span><i style="background:#d97706"></i>搜索结果</span>
    </div>
    <h3>本线路涉及的车站</h3>
    <div id="list"></div>
  </div>
  <div id="map"></div>
</div>

<script>
const STOPS = __STOPS__;
const ALL   = __ALL__;
const CITY  = __CITY__;
const PCITY = __PCITY__;
const PROV  = __PROV__;
const GEO   = __GEO__;   // 站名 -> [lng,lat]（城市级，已内置约 85% 车站）

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// 站名 -> 归属城市（由 CITY 反查，用于运行时地理编码兜底）
const CITYREV = {};
for(const [city, arr] of Object.entries(CITY || {}))
  for(const s of (arr||[])) CITYREV[s] = city;

let map, baseA, baseO, baseLayer = 'amap';
const MARKED = new Map();          // 站名 -> {lat,lng,kind,title}
const FAILED = new Set();          // 定位失败的站名
const LS = id => { try{ return localStorage.getItem(id); }catch(e){ return null; } };
const LSset = (id,v) => { try{ localStorage.setItem(id,v); }catch(e){} };

/* WGS-84 -> GCJ-02（火星坐标系）转换，用于在高德底图上精确对齐 */
function outOfChina(lng,lat){return !(lng>73.66&&lng<135.05&&lat>3.86&&lat<53.55);}
function transformLat(x,y){
  let r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
  r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;
  r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;
  return r;
}
function transformLng(x,y){
  let r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
  r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;
  r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;
  return r;
}
function wgs84ToGcj02(lng,lat){
  if(outOfChina(lng,lat)) return [lng,lat];
  const a=6378245.0, ee=0.00669342162296594323;
  let dLat=transformLat(lng-105.0, lat-35.0);
  let dLng=transformLng(lng-105.0, lat-35.0);
  const radLat=lat/180*Math.PI;
  let magic=Math.sin(radLat); magic=1-ee*magic*magic;
  const sqrtMagic=Math.sqrt(magic);
  dLat=(dLat*180.0)/((a*(1-ee))/(magic*sqrtMagic)*Math.PI);
  dLng=(dLng*180.0)/(a/sqrtMagic*Math.cos(radLat)*Math.PI);
  return [lng+dLng, lat+dLat];
}
// 当前底图坐标系下的 [lat,lng]（高德=GCJ02，OSM=WGS84）
function toMap(lat,lng){
  if(baseLayer==='amap'){ const g=wgs84ToGcj02(lng,lat); return [g[1],g[0]]; }
  return [lat,lng];
}

/* ---------- 动态加载 Leaflet（多 CDN 兜底） ---------- */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');
  s.src=src; s.onload=res; s.onerror=()=>rej(new Error('load '+src)); document.head.appendChild(s);});}
function loadCSS(href){return new Promise((res)=>{const l=document.createElement('link');
  l.rel='stylesheet'; l.href=href; l.onload=res; l.onerror=res; document.head.appendChild(l);});}
const LEAFLET_CDNS=[
  'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4',
  'https://unpkg.com/leaflet@1.9.4/dist',
  'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist'
];
async function ensureLeaflet(){
  if(window.L) return true;
  for(const base of LEAFLET_CDNS){
    try{
      await loadCSS(base + '/leaflet.css');
      await loadScript(base + '/leaflet.js');
      if(window.L) return true;
    }catch(e){ /* 试下一个 CDN */ }
  }
  return false;
}

/* ---------- 坐标获取：内置 GEO 优先，缺失的城市运行时 Photon 补全 ---------- */
async function getCoord(name){
  if(GEO && GEO[name]) return GEO[name];
  const city = CITYREV[name] || name;
  const key = 'tcr.geo.' + city;
  const cached = LS(key);
  if(cached) { try{ return JSON.parse(cached); }catch(e){} }
  // 浏览器端调用 Photon（免密钥，中文友好）；失败则该站标不出
  try{
    const u = 'https://photon.komoot.de/api/?q=' + encodeURIComponent(city) + '&limit=1';
    const r = await fetch(u, {signal: AbortSignal.timeout ? AbortSignal.timeout(8000) : undefined});
    const d = await r.json();
    if(d && d.features && d.features.length){
      const c = d.features[0].geometry.coordinates;   // [lng,lat]
      const coord = [c[0], c[1]];
      LSset(key, JSON.stringify(coord));
      return coord;
    }
  }catch(e){ /* 网络不通等 */ }
  return null;
}

/* ---------- 初始化 ---------- */
function boot(){
  if(typeof L === 'undefined'){
    $('hint').textContent = '地图组件未加载';
    note('地图组件加载失败：无法连接地图库 CDN。请检查网络后刷新页面。', true);
    return;
  }
  map = L.map('map', {zoomControl:true, attributionControl:true}).setView([35.5, 105], 5);

  // 高德路网瓦片：国内确定可达、免密钥，坐标系 GCJ-02
  baseA = L.tileLayer(
    'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
    {maxZoom:18, subdomains:'1234', attribution:'© 高德地图'});
  // OSM 兜底（坐标系 WGS-84）
  baseO = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19, subdomains:'abc', attribution:'© OpenStreetMap'});
  baseA.addTo(map);
  // 高德不可达时自动切 OSM
  let amapErr = 0;
  baseA.on('tileerror', ()=>{ if(++amapErr >= 3 && baseLayer==='amap'){ switchBase(); } });

  $('go').onclick = doSearch;
  $('q').onkeydown = e=>{ if(e.key==='Enter') doSearch(); };
  $('fit').onclick = fitAll;
  $('base').onclick = switchBase;
  bindSuggest();

  renderList();
  loadAll();
}

function switchBase(){
  if(baseLayer === 'amap'){ map.removeLayer(baseA); baseO.addTo(map); baseLayer='osm'; }
  else { map.removeLayer(baseO); baseA.addTo(map); baseLayer='amap'; }
  $('hint').textContent = '底图：' + (baseLayer==='amap' ? '高德地图' : 'OpenStreetMap');
  draw();   // 切换坐标系后重画，保证圆点与底图对齐
}

/* ---------- 加载线路车站（并发 + 进度） ---------- */
async function loadAll(){
  if(!STOPS.length){
    note('本页没有内置线路数据。启动本地服务重新查询后，地图会标出该线路涉及的车站。');
    return;
  }
  let done = 0;
  const queue = STOPS.slice();
  async function worker(){
    while(queue.length){
      const s = queue.shift();
      const c = await getCoord(s.n);
      done++;
      if(c) MARKED.set(s.n, {lat:c[1], lng:c[0], kind:s.k, title:s.n});
      else FAILED.add(s.n);
      $('note').textContent = '正在定位车站 ' + done + '/' + STOPS.length
        + '（已标注 ' + MARKED.size + ' 个' + (FAILED.size ? '，失败 ' + FAILED.size : '') + '）';
      if(done % 3 === 0 || done === STOPS.length){ draw(); renderList(); }
    }
  }
  await Promise.all([worker(), worker(), worker()]);
  draw(); renderList(); fitAll();
  let msg = '已标注 <b>' + MARKED.size + '/' + STOPS.length + '</b> 个车站。'
    + '滚轮或双指可缩放，点圆点看站名。'
    + (FAILED.size ? '<br>有 ' + FAILED.size + ' 个站没能定位（侧栏灰色，点一下可重试）。' : '');
  note(msg);
  $('hint').textContent = '底图：高德地图（可切换 OSM）';
}

/* ---------- 搜索：支持车站与城市 ---------- */
function resolve(kw){
  kw = (kw||'').trim();
  if(!kw) return [];
  if(CITY && CITY[kw] && CITY[kw].length) return CITY[kw].slice(0,3);
  if(PCITY && PCITY[kw]){
    const out = [];
    for(const c of (PCITY[kw]||[]).slice(0,3))
      for(const s of ((CITY && CITY[c])||[]).slice(0,1))
        if(!out.includes(s)) out.push(s);
    return out;
  }
  return [kw];
}
async function doSearch(){
  const kw = $('q').value.trim();
  if(!kw) return;
  $('sug').classList.remove('on');
  const names = resolve(kw);
  const isCity = names.length>1 || names[0]!==kw;
  note('正在查找「'+esc(kw)+'」'+(isCity?'（'+names.join(' / ')+'）':'')+'…');
  const found = [];
  for(const n of names){
    const c = await getCoord(n);
    if(c){ MARKED.set(n,{lat:c[1],lng:c[0],kind:'hit',title:n}); FAILED.delete(n); found.push(n); }
    else FAILED.add(n);
  }
  draw(); renderList();
  if(!found.length){
    note('没找到「'+esc(kw)+'」的位置，换个说法试试（如「北京西」「广州南」，或直接填城市名）。', true);
    return;
  }
      if(found.length===1){
        const v = MARKED.get(found[0]);
        map.setView(toMap(v.lat, v.lng), 13);
      } else {
    fitTo(found);
  }
  note('已定位「'+esc(kw)+'」→ <b>'+esc(found.join(' / '))+'</b>');
}

/* ---------- 补全 ---------- */
function bindSuggest(){
  const inp=$('q'), box=$('sug');
  inp.addEventListener('input', ()=>{
    const kw=inp.value.trim();
    if(!kw){ box.classList.remove('on'); return; }
    const cities=Object.keys(CITY||{}).filter(c=>c.indexOf(kw)>=0).slice(0,6);
    const provs =Object.keys(PCITY||{}).filter(p=>p.indexOf(kw)>=0).slice(0,3);
    const stns  =(ALL||[]).filter(n=>n.indexOf(kw)>=0).slice(0,8);
    let h='';
    if(provs.length) h+='<div class="g">省份</div>'
      +provs.map(p=>'<div class="i" data-n="'+esc(p)+'">🏞 '+esc(p)
        +'<span>'+(PCITY[p]||[]).length+' 个城市</span></div>').join('');
    if(cities.length) h+='<div class="g">城市</div>'
      +cities.map(c=>'<div class="i" data-n="'+esc(c)+'">🏙 '+esc(c)
        +'<span>'+(CITY[c]||[]).length+' 个车站</span></div>').join('');
    if(stns.length) h+='<div class="g">车站</div>'
      +stns.map(n=>'<div class="i" data-n="'+esc(n)+'">🚉 '+esc(n)+'</div>').join('');
    if(!h){ box.classList.remove('on'); return; }
    box.innerHTML=h; box.classList.add('on');
    [...box.querySelectorAll('.i')].forEach(d=>{
      d.onmousedown=()=>{ inp.value=d.dataset.n; box.classList.remove('on'); doSearch(); };
    });
  });
  inp.addEventListener('blur', ()=>setTimeout(()=>box.classList.remove('on'),200));
  inp.addEventListener('focus', ()=>{ if(inp.value.trim()) inp.dispatchEvent(new Event('input')); });
}

/* ---------- 绘制 ---------- */
const COLORS = {start:'#16a34a', end:'#dc2626', via:'#2563eb', hit:'#d97706'};
const RADII  = {start:7, end:7, via:5, hit:8};
function draw(){
  // 清旧
  if(window.__layer) __layer.remove();
  const fg = [];
  MARKED.forEach((v,k)=>{
    const color = COLORS[v.kind] || '#9ca3af';
    const ll = toMap(v.lat, v.lng);
    const m = L.circleMarker(ll, {
      radius: RADII[v.kind] || 5, color:'#fff', weight:2, fillColor:color, fillOpacity:1
    });
    const pv = (PROV && PROV[k]) ? ' <span style="color:#9ca3af">'+esc(PROV[k])+'</span>' : '';
    m.bindPopup('<div style="font-size:13px;white-space:nowrap"><b>'+esc(k)+'</b>'+pv+'</div>');
    if(map.getZoom() >= 6)
      m.bindTooltip(k, {permanent:true, direction:'top', offset:[0,-4], opacity:0.9});
    else m.bindTooltip(k);
    fg.push(m);
  });
  window.__layer = L.layerGroup(fg).addTo(map);
}
function fitTo(names){
  let b=null;
  for(const nm of names){
    const v=MARKED.get(nm); if(!v) continue;
    const ll=L.latLng(...toMap(v.lat, v.lng));
    b = b ? b.extend(ll) : L.latLngBounds(ll, ll);
  }
  if(!b) return;
  if(b.getNorth()===b.getSouth() && b.getEast()===b.getWest()){
    map.setView([b.getSouth(), b.getWest()], 13);
  } else {
    map.fitBounds(b, {padding:[60,60]});
  }
}
function fitAll(){ if(MARKED.size) fitTo([...MARKED.keys()]); }

const cls = k => ({start:'g', end:'r', via:'b', hit:'o'})[k] || 'g2';
function renderList(){
  const order = {start:0, end:1, hit:2, via:3};
  const arr = [...MARKED.entries()].sort((a,b)=>(order[a[1].kind]??9)-(order[b[1].kind]??9));
  const miss = [...FAILED].filter(n=>!MARKED.has(n));
  let html = arr.length ? arr.map(([n,v])=>
    '<div class="st '+cls(v.kind)+'" data-n="'+esc(n)+'"><b></b>'+esc(n)
    +'<span>'+v.lat.toFixed(2)+', '+v.lng.toFixed(2)+'</span></div>').join('')
    : '<div class="note">还没有车站被标注。</div>';
  if(miss.length){
    html += '<h3 style="margin-top:10px">未能定位（点一下重试）</h3>'
      + miss.map(n=>'<div class="st fail g2" data-n="'+esc(n)+'"><b></b>'+esc(n)
        +'<span class="rt">重试</span></div>').join('');
  }
  $('list').innerHTML = html;
  [...$('list').children].forEach(d=>{
    const n=d.dataset.n; if(!n) return;
    d.onclick = async ()=>{
      const v=MARKED.get(n);
      if(v){ map.setView(toMap(v.lat, v.lng), 12); return; }
      const sp=d.querySelector('.rt'); if(sp) sp.textContent='定位中…';
      const c = await getCoord(n);
      if(c){
        MARKED.set(n,{lat:c[1],lng:c[0],kind:'hit',title:n}); FAILED.delete(n);
        draw(); renderList(); map.setView(toMap(c[1],c[0]),12);
      }else{
        if(sp) sp.textContent='重试';
        note('「'+esc(n)+'」还是没定位到（网络或城市名不匹配）。', true);
      }
    };
  });
}

function note(html, err){
  const el=$('note'); el.innerHTML=html; el.className='note'+(err?' err':'');
}

/* ---------- 启动 ---------- */
(async function(){
  const ok = await ensureLeaflet();
  if(!ok){ $('hint').textContent='地图组件未加载';
    note('地图组件加载失败：无法连接地图库 CDN（cdnjs/unpkg/jsdelivr）。请检查网络后刷新。', true);
    return; }
  boot();
})();
</script>
</body>
</html>
